name: Daily build

# ONCE A DAY, THE FIRST CHANCE AFTER 6AM EASTERN.
#
# This used to ask "is it exactly 6am in New York?" and run only then. GitHub
# delivers a cron when it has a runner free, not when it says, and on this
# repo that has meant three to nine hours late -- so the guard turned every
# run away and the site did not rebuild itself between 24 September and
# 11 October 2026. Asking for an exact hour cannot work against a best-effort
# schedule.
#
# So it fires every three hours and the guard asks a question that a late run
# can still answer yes to: is it past 6am in New York, and has today's build
# not happened yet? The first eligible run does the work and stamps the day
# in data/last-build; the rest of the day's runs see the stamp and skip in
# seconds. One build a day, as early as GitHub will allow, and daylight
# saving takes care of itself.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:          # the Run workflow button, any time

permissions:
  contents: write             # the job commits the rebuilt site

concurrency:
  group: daily-build
  cancel-in-progress: false   # never let two builds race to push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # the stamp lives in the repo, so a shallow checkout is enough to read it
      - uses: actions/checkout@v4

      - name: Is today's build still to come?
        id: clock
        run: |
          today=$(TZ=America/New_York date +%F)
          hour=$(TZ=America/New_York date +%H)
          last=$(cat data/last-build 2>/dev/null || echo none)
          echo "New York: $today $hour:00 -- last build $last"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run by hand -- building"
            echo "go=yes" >> "$GITHUB_OUTPUT"
          elif [ "$((10#$hour))" -lt 6 ]; then
            echo "before 6am -- too early, waiting for the next one"
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$last" = "$today" ]; then
            echo "already built today -- skipping"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "building"
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.clock.outputs.go == 'yes'
        with:
          python-version: "3.12"

      - name: Install requests
        if: steps.clock.outputs.go == 'yes'
        run: pip install requests

      # cache/ holds raw ESPN answers for FINISHED seasons, which never change.
      # With it restored a run only asks about the current season and anything
      # new; without it, every run would re-download thirteen years.
      # (data/ is committed instead -- the goal lists, opponent finishes, team
      # details and TV listings the site is built from.)
      - name: Restore the ESPN cache
        if: steps.clock.outputs.go == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: |
            espn-cache-

      - name: Harvest
        if: steps.clock.outputs.go == 'yes'
        run: python harvest.py

      - name: Build the site
        if: steps.clock.outputs.go == 'yes'
        run: python site.py

      - name: Refresh the Sheet CSVs
        if: steps.clock.outputs.go == 'yes'
        run: python sheet_csv.py

      # THE STAMP IS WRITTEN EVEN IF NOTHING ELSE CHANGED, and written only
      # once the harvest and the build have both come through: a run that died
      # on a bad ESPN answer leaves yesterday's date, so the next cron three
      # hours later tries again instead of calling the day done.
      - name: Stamp the day
        if: steps.clock.outputs.go == 'yes'
        run: TZ=America/New_York date +%F > data/last-build

      - name: Commit and push
        if: steps.clock.outputs.go == 'yes'
        run: |
          git config user.name "soccer-history bot"
          git config user.email "actions@github.com"
          git add docs data sheet || true
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Daily build $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ALWAYS save, even if the harvest died partway: a cold run that fails on
      # one bad ESPN answer must not throw away the hundreds of files it did
      # fetch.
      - name: Save the ESPN cache
        if: always() && steps.clock.outputs.go == 'yes'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}
